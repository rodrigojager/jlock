name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --no-fail-fast
        env:
          # 200 cycles of the stress test in CI (1000 locally): CI runners are slower.
          JLOCK_TEST_CYCLES: "200"
      - name: Shellcheck install.sh
        if: runner.os == 'Linux'
        run: shellcheck install.sh
      - name: Build release
        run: cargo build --release
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: jlock-${{ matrix.os }}
          path: |
            target/release/jlock
            target/release/jlock.exe
          if-no-files-found: error
