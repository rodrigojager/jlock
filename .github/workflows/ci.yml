name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        if: runner.os != 'macOS'
        run: cargo test --no-fail-fast
        env:
          # 200 cycles of the stress test in CI (1000 locally): CI runners are slower.
          JLOCK_TEST_CYCLES: "200"
      - name: Diagnose native self-command
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cargo build --bin jlock
          python3 - <<'PY'
          import os, subprocess, tempfile, signal
          with tempfile.TemporaryDirectory() as home:
              env = dict(os.environ, JLOCK_HOME=home, JLOCK_DEBUG='1')
              binary = os.path.abspath('target/debug/jlock')
              p = subprocess.Popen([binary, 'run', 'name:nightly', '--command-timeout', '2s', '--', binary, 'list'], env=env, stdout=subprocess.PIPE, stderr=subprocess.PIPE, start_new_session=True)
              try:
                  out, err = p.communicate(timeout=8)
                  print('exit', p.returncode, out.decode(), err.decode(), flush=True)
                  assert p.returncode == 0
              except subprocess.TimeoutExpired:
                  subprocess.run(['ps', '-axo', 'pid,ppid,pgid,state,command'])
                  subprocess.run(['sample', str(p.pid), '1', '-file', '/dev/stdout'])
                  children = subprocess.run(['pgrep', '-P', str(p.pid)], capture_output=True, text=True).stdout.split()
                  for child in children:
                      subprocess.run(['sample', child, '1', '-file', '/dev/stdout'])
                      os.kill(int(child), signal.SIGKILL)
                  os.killpg(p.pid, signal.SIGKILL)
                  out, err = p.communicate(timeout=3)
                  print(out.decode(), err.decode(), flush=True)
                  raise
          PY
      - name: Test native macOS
        if: runner.os == 'macOS'
        run: cargo test --no-fail-fast
        env:
          JLOCK_TEST_CYCLES: "200"
      - name: Shellcheck install.sh
        if: runner.os == 'Linux'
        run: shellcheck install.sh
      - name: Build release
        run: cargo build --release
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: jlock-${{ matrix.os }}
          path: |
            target/release/jlock
            target/release/jlock.exe
          if-no-files-found: error
