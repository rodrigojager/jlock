name: release

# A tag v* builds jlock for every target, packs each binary with LICENSE and README.md, writes
# SHA256SUMS and publishes a GitHub Release. See docs/RELEASING.md.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches Cargo.toml
        id: check
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          if [ "$tag" != "$crate" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $crate"
            exit 1
          fi
          echo "version=$crate" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-14 # cross from arm64: the macos-13 (Intel) runners were retired
          - target: aarch64-apple-darwin
            os: macos-14
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      JLOCK_TEST_CYCLES: "200"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      # The suite runs on every runner, for the runner's own target (x86_64-apple-darwin is built on
      # an arm64 runner, so the tests that run there are the arm64 ones).
      - name: Test
        run: cargo test --locked --no-fail-fast
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Pack (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "jlock-$env:VERSION-${{ matrix.target }}"
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/jlock.exe", LICENSE, README.md -Destination dist
          Compress-Archive -Path dist/jlock.exe, dist/LICENSE, dist/README.md -DestinationPath "$name.zip"
      - name: Pack (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          name="jlock-$VERSION-${{ matrix.target }}"
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/jlock" LICENSE README.md dist/
          tar -czf "$name.tar.gz" -C dist jlock LICENSE README.md
      - uses: actions/upload-artifact@v4
        with:
          name: jlock-${{ matrix.target }}
          path: |
            jlock-*.zip
            jlock-*.tar.gz
          if-no-files-found: error

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: SHA256SUMS
        working-directory: artifacts
        run: sha256sum jlock-* > SHA256SUMS && cat SHA256SUMS
      - name: Notes
        shell: bash
        run: |
          # The section of CHANGELOG.md for this version, if there is one.
          if [ -f CHANGELOG.md ]; then
            awk -v v="$VERSION" '
              /^## / { inside = (index($0, v) > 0); next }
              inside { print }
            ' CHANGELOG.md > notes.md
          fi
          touch notes.md
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [ -s notes.md ]; then
            notes=(--notes-file notes.md)
          else
            notes=(--generate-notes)
          fi
          gh release create "$GITHUB_REF_NAME" artifacts/* --title "jlock $VERSION" "${notes[@]}"
