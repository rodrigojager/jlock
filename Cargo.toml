[package]
name = "jlock"
version = "0.1.0"
edition = "2021"
description = "Machine-wide locks for files, folders and names: fair queue, heartbeat recovery, deadlock detection, no server"
license = "MIT"
authors = ["Rodrigo Jäger <rodrigojager@gmail.com>"]
repository = "https://github.com/rodrigojager/jlock"
readme = "README.md"
keywords = ["lock", "flock", "mutex", "cli", "concurrency"]
categories = ["command-line-utilities", "concurrency"]

[[bin]]
name = "jlock"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
strip = true
