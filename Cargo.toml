[package]
name = "jlock"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "jlock"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
strip = true
